plugins {
    id "base"
}

import java.util.Properties

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream(localProperties.&load)
}

def sdkRoot = localProperties.getProperty("sdk.dir")
    ?: System.getenv("ANDROID_SDK_ROOT")
    ?: System.getenv("ANDROID_HOME")
if (!sdkRoot) {
    throw new GradleException("Android SDK not found. Set ANDROID_SDK_ROOT, ANDROID_HOME, or local.properties.")
}

def buildToolsVersion = "37.0.0"
def compileSdk = 35
def minSdk = 24
def targetSdk = 35
def isWindows = System.getProperty("os.name").toLowerCase().contains("win")
def executable = { String name -> new File("${sdkRoot}/build-tools/${buildToolsVersion}/${name}${isWindows ? '.exe' : ''}") }
def javaExecutable = {
    def javaHome = System.getenv("JAVA_HOME")
    if (javaHome) {
        return new File("${javaHome}/bin/javac${isWindows ? '.exe' : ''}")
    }
    return new File("javac")
}
def androidJar = file("${sdkRoot}/platforms/android-${compileSdk}/android.jar")
def aapt2 = executable("aapt2")
def d8 = executable("d8")
def zipalign = executable("zipalign")
def apksigner = executable("apksigner")
def javac = javaExecutable()
def debugKeystore = rootProject.layout.buildDirectory.file("keystore/debug.keystore")
def generatedRDir = layout.buildDirectory.dir("generated/source/r/debug")
def resourceZip = layout.buildDirectory.file("intermediates/resources/resources.zip")
def classesDir = layout.buildDirectory.dir("intermediates/javac/debug/classes")
def classesJar = layout.buildDirectory.file("intermediates/javac/debug/classes.jar")
def dexDir = layout.buildDirectory.dir("intermediates/dex/debug")
def unsignedApk = layout.buildDirectory.file("outputs/apk/debug/app-unsigned.apk")
def packagedApk = layout.buildDirectory.file("outputs/apk/debug/app-packaged.apk")
def alignedApk = layout.buildDirectory.file("outputs/apk/debug/app-aligned.apk")
def debugApk = layout.buildDirectory.file("outputs/apk/debug/app-debug.apk")

tasks.register("validateAndroidSdk") {
    doLast {
        [androidJar, aapt2, d8, zipalign, apksigner, javac].each { artifact ->
            if (!artifact.exists()) {
                throw new GradleException("Required Android build artifact is missing: ${artifact}")
            }
        }
    }
}

tasks.register("compileResources", Exec) {
    dependsOn("validateAndroidSdk")
    inputs.dir("src/main/res")
    outputs.file(resourceZip)
    doFirst {
        resourceZip.get().asFile.parentFile.mkdirs()
    }
    commandLine(
        aapt2.absolutePath,
        "compile",
        "--dir", file("src/main/res").absolutePath,
        "-o", resourceZip.get().asFile.absolutePath
    )
}

tasks.register("linkDebugApk", Exec) {
    dependsOn("compileResources")
    inputs.file("src/main/AndroidManifest.xml")
    inputs.file(resourceZip)
    outputs.file(unsignedApk)
    outputs.dir(generatedRDir)
    doFirst {
        generatedRDir.get().asFile.mkdirs()
        unsignedApk.get().asFile.parentFile.mkdirs()
    }
    commandLine(
        aapt2.absolutePath,
        "link",
        "-o", unsignedApk.get().asFile.absolutePath,
        "--manifest", file("src/main/AndroidManifest.xml").absolutePath,
        "-I", androidJar.absolutePath,
        "--java", generatedRDir.get().asFile.absolutePath,
        "--auto-add-overlay",
        "--min-sdk-version", minSdk.toString(),
        "--target-sdk-version", targetSdk.toString(),
        resourceZip.get().asFile.absolutePath
    )
}

tasks.register("compileJava", Exec) {
    dependsOn("linkDebugApk")
    inputs.dir("src/main/java")
    inputs.dir(generatedRDir)
    outputs.dir(classesDir)
    doFirst {
        classesDir.get().asFile.mkdirs()
        def sourceFiles = (fileTree("src/main/java") + fileTree(generatedRDir)).matching { include "**/*.java" }.files
        commandLine(
            javac.absolutePath,
            "-source", "8",
            "-target", "8",
            "-bootclasspath", androidJar.absolutePath,
            "-d", classesDir.get().asFile.absolutePath,
            *sourceFiles.collect { it.absolutePath }
        )
    }
}

tasks.register("jarClasses", Jar) {
    dependsOn("compileJava")
    archiveFileName = classesJar.get().asFile.name
    destinationDirectory = classesJar.get().asFile.parentFile
    from(classesDir)
}

tasks.register("dexDebug", Exec) {
    dependsOn("jarClasses")
    inputs.file(classesJar)
    outputs.dir(dexDir)
    doFirst {
        dexDir.get().asFile.mkdirs()
    }
    commandLine(
        d8.absolutePath,
        "--lib", androidJar.absolutePath,
        "--min-api", minSdk.toString(),
        "--output", dexDir.get().asFile.absolutePath,
        classesJar.get().asFile.absolutePath
    )
}

tasks.register("packageDebugApk") {
    dependsOn("linkDebugApk", "dexDebug")
    inputs.files(unsignedApk, dexDir)
    outputs.file(packagedApk)
    doLast {
        copy {
            from unsignedApk.get().asFile
            into packagedApk.get().asFile.parentFile
            rename { packagedApk.get().asFile.name }
        }
        ant.zip(destfile: packagedApk.get().asFile, update: true) {
            zipfileset(file: new File(dexDir.get().asFile, "classes.dex"), fullpath: "classes.dex")
        }
    }
}

tasks.register("generateDebugKeystore", Exec) {
    outputs.file(debugKeystore)
    onlyIf {
        !debugKeystore.get().asFile.exists()
    }
    doFirst {
        debugKeystore.get().asFile.parentFile.mkdirs()
        commandLine(
            "keytool",
            "-genkeypair",
            "-alias", "androiddebugkey",
            "-keyalg", "RSA",
            "-keysize", "2048",
            "-validity", "10000",
            "-keystore", debugKeystore.get().asFile.absolutePath,
            "-storepass", "android",
            "-keypass", "android",
            "-dname", "CN=Android Debug,O=Android,C=US"
        )
    }
}

tasks.register("alignDebugApk", Exec) {
    dependsOn("packageDebugApk")
    inputs.file(packagedApk)
    outputs.file(alignedApk)
    doFirst {
        alignedApk.get().asFile.parentFile.mkdirs()
    }
    commandLine(
        zipalign.absolutePath,
        "-f",
        "4",
        packagedApk.get().asFile.absolutePath,
        alignedApk.get().asFile.absolutePath
    )
}

tasks.register("signDebugApk", Exec) {
    dependsOn("generateDebugKeystore", "alignDebugApk")
    inputs.files(alignedApk, debugKeystore)
    outputs.file(debugApk)
    doFirst {
        debugApk.get().asFile.parentFile.mkdirs()
    }
    commandLine(
        apksigner.absolutePath,
        "sign",
        "--ks", debugKeystore.get().asFile.absolutePath,
        "--ks-key-alias", "androiddebugkey",
        "--ks-pass", "pass:android",
        "--key-pass", "pass:android",
        "--out", debugApk.get().asFile.absolutePath,
        alignedApk.get().asFile.absolutePath
    )
}

tasks.register("verifyDebugApk", Exec) {
    dependsOn("signDebugApk")
    inputs.file(debugApk)
    commandLine(
        apksigner.absolutePath,
        "verify",
        "--verbose",
        debugApk.get().asFile.absolutePath
    )
}

tasks.register("assembleDebug") {
    dependsOn("signDebugApk")
}

tasks.named("assemble") {
    dependsOn("assembleDebug")
}

tasks.named("check") {
    dependsOn("verifyDebugApk")
}
