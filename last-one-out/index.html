<style>
/* One phone screen, no scrolling while playing: scene on top, vitals, then the phase card. Dark-first: night at camp. */
:root {
  --bg: #121a17; --panel: #1a2621; --panel2: #22312a; --line: #2f4239;
  --fg: #e8e2d2; --muted: #9aa894; --faint: #6f7f72;

  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #efe9dc; --panel: #f8f4ea; --panel2: #e6dfcf; --line: #d3cab6;
  --fg: #1d2722; --muted: #5d6a5f; --faint: #8a9488;
  --ember: #c4531c; --ember-ink: #fff8f2; --ice: #2f6f8c; --good: #3f7f3a; --warn: #9a6c08; --bad: #b23a2e; --big: #8a5a00; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #efe9dc; --panel: #f8f4ea; --panel2: #e6dfcf; --line: #d3cab6;
  --fg: #1d2722; --muted: #5d6a5f; --faint: #8a9488;
  --ember: #c4531c; --ember-ink: #fff8f2; --ice: #2f6f8c; --good: #3f7f3a; --warn: #9a6c08; --bad: #b23a2e; --big: #8a5a00; color-scheme: light; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 28px; display: flex; flex-direction: column; gap: 12px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; letter-spacing: .01em; margin: 0; text-wrap: balance; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.tone-good { color: var(--good); } .tone-bad { color: var(--bad); } .tone-warn { color: var(--warn); } .tone-big { color: var(--big); font-weight: 700; } .tone-info { color: var(--fg); } .tone-muted { color: var(--faint); }

/* ---------- setup */
.hero { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; }

.step { display: flex; flex-direction: column; gap: 8px; }

.seasons { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; padding-right: 2px; }
.season { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 11px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; cursor: pointer; }

.season .stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 0 20px; margin-top: 6px; font-size: 11px; color: var(--muted); }

.diff { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; align-self: center; }
.d0 { color: var(--good); } .d0b { color: color-mix(in srgb, var(--good) 45%, var(--warn)); } .d1 { color: var(--warn); } .d2 { color: var(--ember); } .d3 { color: var(--bad); }
.gear { max-height: 360px; overflow-y: auto; padding-right: 2px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.item { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 7px 9px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.item[aria-pressed="true"] { background: var(--ember); color: var(--ember-ink); border-color: var(--ember); }

.opts { display: grid; gap: 10px; padding-top: 10px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
.opt input[type=number] { width: 88px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; color: var(--fg); font-family: var(--mono); }
.big-btn { width: 100%; border: 0; border-radius: 12px; padding: 14px; background: var(--ember); color: var(--ember-ink); font-family: var(--display); font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; position: relative; overflow: hidden; }
.big-btn:disabled { opacity: .45; cursor: not-allowed; }
.big-btn.sm { font-size: 19px; padding: 11px; }

/* ---------- sheets (camp, body, notes, journal, all jobs, menu) */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 84vh; overflow-y: auto; background: var(--bg); border-radius: 16px 16px 0 0; padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; animation: up .22s ease; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet h2 { font-size: 24px; text-transform: uppercase; }
.act { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; text-align: left; border: 0; background: var(--panel); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.act.picked { outline: 2px solid var(--ember); }
.act:disabled { cursor: default; background: transparent; border: 1px solid var(--line); }
.act:disabled b { color: var(--faint); }
.act b { font-size: 15px; } .act .o { font-family: var(--mono); font-size: 13px; color: var(--ember); align-self: center; }
.act small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.grp { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-top: 8px; }
.danger { color: var(--bad); border-color: var(--bad) !important; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; align-items: baseline; }
.row > :last-child { text-align: right; color: var(--muted); }
.sect { font-family: var(--display); font-size: 17px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-top: 4px; }
.seg { display: flex; gap: 4px; }
.seg button { flex: 1; border: 1px solid var(--line); background: none; border-radius: 8px; padding: 6px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { border-color: var(--ember); color: var(--ember); font-weight: 700; }
.spark { width: 100%; height: 56px; display: block; }
.spark path.l { fill: none; stroke: var(--ember); stroke-width: 2; }
.spark path.a { fill: var(--ember); opacity: .12; }
.spark line { stroke: var(--bad); stroke-dasharray: 3 3; stroke-width: 1; }
.spark text { fill: var(--muted); font: 10px var(--mono); }
.journal li { animation: none; }

/* ---------- the world */
.play { position: fixed; inset: 0; overflow: hidden; background: #2a3a2a; touch-action: none; }
.play canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; padding: calc(8px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)); gap: 6px; }
.hud > * { pointer-events: none; }
.hud button, .hud .chip { pointer-events: auto; }
.hud-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }

.hud .where { font-size: 12px; color: rgba(255,255,255,.88); text-shadow: 0 1px 6px rgba(0,0,0,.7); }
.hud-top > div:first-child { min-width: 0; flex: 1 1 auto; }
.hud-r { display: flex; gap: 5px; align-items: center; flex: 0 1 auto; flex-wrap: wrap; justify-content: flex-end; row-gap: 5px; max-width: 64%; }
.hud-r .iconbtn { order: -1; }
.hud-r .chip { font-size: 11px; padding: 3px 7px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.hud .chip.goal, .hud .chip.cond { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.hud .chip { background: rgba(0,0,0,.42); color: #fff; backdrop-filter: blur(4px); }
.hud .chip.goal { background: rgba(10,16,14,.5); color: rgba(255,255,255,.9); margin-top: 4px; font-size: 11.5px; }

.pips i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); margin: 0 1px; }
.pips i.on { background: var(--ember); }
.iconbtn { background: rgba(0,0,0,.42); border: 0; border-radius: 999px; width: 30px; height: 30px; cursor: pointer; display: grid; place-items: center; color: #fff; flex: none; font-size: 18px; line-height: 1; }
.hud .vitals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; max-width: 420px; }
.hud .vital { position: relative; background: rgba(10,16,14,.55); backdrop-filter: blur(6px); border-radius: 9px; padding: 5px 8px 6px; display: flex; flex-direction: column; gap: 2px; min-width: 0; color: #fff; }
.hud .vital .label { color: rgba(255,255,255,.65); font-size: 10px; }
.hud .vital .v { font-family: var(--mono); font-size: 15px; white-space: nowrap; }
.hud .vital .v small { font-size: 10px; opacity: .7; }
.hud .bar { background: rgba(255,255,255,.15); }
.banner { display: flex; flex-direction: column; gap: 4px; align-items: center; margin-top: 2px; }
.msg { background: rgba(10,16,14,.78); backdrop-filter: blur(6px); color: #fff; border-radius: 9px; padding: 6px 12px; font-size: 13.5px; max-width: 420px; text-align: center; animation: rise .3s ease; transition: opacity .5s, transform .5s; }
.msg.out { opacity: 0; transform: translateY(-6px); }
.hint { margin-top: auto; text-align: center; color: rgba(255,255,255,.9); text-shadow: 0 1px 6px rgba(0,0,0,.8); font-size: 13.5px; padding: 0 20px 6px; }
.hud .pad { pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; background: rgba(10,16,14,.55); border-radius: 12px; backdrop-filter: blur(6px); }
.mini { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 0 16px 4px; }
.mbar { position: relative; width: min(300px, 80vw); height: 12px; border-radius: 6px; background: rgba(10,16,14,.75); overflow: hidden; }
.mbar i { position: absolute; top: 0; bottom: 0; background: rgba(140,220,130,.55); }
.mbar.heat i { background: linear-gradient(90deg, #f0a040, #ff5a2a); }
.mbar b { position: absolute; top: -1px; bottom: -1px; width: 4px; margin-left: -2px; background: #fff; border-radius: 2px; }
#padtext { min-height: 2.7em; }
.mtext { color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.85); font-size: 13.5px; text-align: center; max-width: 360px; }
.actbtn.dim { opacity: .62; }
.acts { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding-bottom: 2px; }
.acts.many { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 100%; max-width: 520px; margin: 0 auto; }
.acts.many .actbtn { min-width: 0; padding: 7px 8px 8px; border-radius: 10px; justify-content: center; }
.acts.many .actbtn b { font-size: 15.5px; line-height: 1.05; }
.acts.many .actbtn small { font-size: 10.5px; line-height: 1.25; text-align: center; }
.acts.many .actbtn.wide { grid-column: 1 / -1; }
.acts-cap { grid-column: 1 / -1; justify-self: center; pointer-events: none; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.85); background: rgba(10,16,14,.55); backdrop-filter: blur(4px); padding: 2px 10px; border-radius: 999px; }
.actbtn { pointer-events: auto; position: relative; overflow: hidden; border: 0; border-radius: 12px; padding: 10px 14px; min-width: 120px; background: rgba(10,16,14,.82); backdrop-filter: blur(6px); color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; box-shadow: 0 2px 10px rgba(0,0,0,.35); animation: rise .25s ease; touch-action: none; user-select: none; -webkit-user-select: none; }
.actbtn b { font-family: var(--display); font-size: 19px; letter-spacing: .03em; text-transform: uppercase; }
.actbtn small { font-size: 11.5px; color: rgba(255,255,255,.75); font-family: var(--mono); }
.actbtn.primary { background: var(--ember); color: var(--ember-ink); } .actbtn.primary small { color: inherit; opacity: .8; }
.actbtn::after { content: ""; position: absolute; left: 0; bottom: 0; top: 0; width: calc(var(--p, 0) * 100%); background: rgba(232,116,59,.45); pointer-events: none; }
@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.float { position: absolute; right: 8px; left: auto; top: 6px; transform: none; font-family: var(--mono); font-size: 13px; font-weight: 700; pointer-events: none; animation: floatup 1.1s ease-out forwards; white-space: nowrap; }
@keyframes floatup { from { opacity: 0; transform: translateY(6px); } 20% { opacity: 1; } to { opacity: 0; transform: translateY(-22px); } }
.play.shake canvas { animation: shake .45s ease; }
@keyframes shake { 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-3px, 1px); } 80% { transform: translate(2px, -1px); } }

/* ---------- game feel */
.alerts { display: flex; gap: 6px; flex-wrap: wrap; }
.alert { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.badge { background: var(--panel); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.badge b { font-size: 13px; } .badge small { font-size: 11px; color: var(--muted); line-height: 1.3; }
.badge.off { opacity: .4; }
.badge.new { outline: 1px solid var(--big); }
.how .sect { margin-top: 6px; }
.daily { border: 0; background: var(--panel2); border-radius: 12px; padding: 11px 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; text-align: left; color: var(--fg); }
.daily .dtext { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.daily .eyebrow { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ember); font-weight: 700; }

.daily small { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.daily .dplay { flex: none; background: var(--ember); color: var(--ember-ink); font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 999px; }
.row.best { color: var(--big); }
.vol { width: 100%; accent-color: var(--ember); }
.kbd { font-family: var(--mono); font-size: 11px; background: var(--panel2); border-radius: 4px; padding: 1px 5px; color: var(--muted); }

.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 14px; }

/* ---------- end */
.end h1 { font-size: clamp(40px, 12vw, 58px); line-height: .92; text-transform: uppercase; }
.end .won { color: var(--big); } .end .lost { color: var(--fg); }
.cast { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.cast td { padding: 5px 4px; border-bottom: 1px solid var(--line); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--panel); border-radius: 10px; padding: 9px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* a drag on the map or a long press on the HUD should never select text */
#app, .hud, .acts, .actbtn, canvas, .pad { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.sheet { -webkit-user-select: text; user-select: text; }
.sheet button { -webkit-user-select: none; user-select: none; }

function pick1(s, arr) { return arr[Math.floor(rnd(s) * arr.length)]; }
function infect(s, c, L) { c.name += ' (infected)'; c.dmg *= 2; c.days += 6; s.morale -= 6; L.push(['Two days later it is red, hot and throbbing. Infected.', 'bad']); }
function loseMeat(s, frac, L) {
  let lost = 0; for (const x of s.stores) if (['fish', 'game', 'fat', 'organ'].includes(DATA.foods[x.id].kind)) { const l = x.por * frac; x.por -= l; lost += l * DATA.foods[x.id].kcal; }
  for (const x of s.raw) { lost += x.por * frac * DATA.foods[x.id].kcal; x.por *= (1 - frac); }
  s.stores = s.stores.filter(x => x.por > 0.05); s.raw = s.raw.filter(x => x.por > 0.05);
  if (lost > 50) L.push([`Lost ${Math.round(lost).toLocaleString('en-US')} kcal of food.`, 'bad']);
}
function maybeEvent(s, when, lines, lastAction) {

  const pool = Object.entries(EVENTS).filter(([k, e]) => e.when === when && e.cond(s));
  for (const [k, e] of pool) {
    if (when === 'injury' || (when === 'begin' ? dchance(s, 'ev:' + k, e.p) : chance(s, e.p))) {
      const opts = e.options.filter(o => !o.cond || o.cond(s)).map(o => ({ label: o.label, sub: typeof o.sub === 'function' ? o.sub(s) : o.sub }));
      s.event = { id: k, title: e.title, text: e.text(s), options: opts, optIds: e.options.map((o, i) => (!o.cond || o.cond(s)) ? i : -1).filter(i => i >= 0), phase: Math.max(0, Math.min(2, s.phase)) };

}
function choose(s, i) {
  if (!s.event) return [];
  const e = EVENTS[s.event.id]; const o = e.options[s.event.optIds[i] ?? s.event.optIds[0]];
  const L = []; s.event = null; o.go(s, L); s.morale = clamp(s.morale, 0, 100); s.today.lines.push(...L); return L;
}

// ------------------------------------------------------------------ night: traps, spoilage, fire, eating, body, rivals
const FLUE_SIGNS = [
  ['A dark scorch on the poles over the hearth, about the size of your hand.', 'The inside of the roof smells like a struck match when you wake.', 'Soot has crept up the back wall in a long streak.'],
  ['Black flakes of char on your sleeping spot. They came from somewhere above you.', 'The poles nearest the fire are shiny and sticky, the resin cooked out of them.', 'You woke to a crackle in the roof that was not rain.'],
  ['A red speck lifted off the fire, caught in the roof boughs and went out by itself. You lay watching that spot until light.', 'The bark on the ridge pole has gone brown and brittle on the fire side. It crumbles under your thumb.', 'A thread of smoke from the roof itself, not the fire. It stops when you look closer.']];
function flueSign(s, risk) { const band = risk >= 0.6 ? 2 : risk >= 0.38 ? 1 : risk >= 0.18 ? 0 : -1; if (band < 0 || !chance(s, 0.6)) return null; const L = FLUE_SIGNS[band]; let k = Math.floor(rnd(s) * L.length); if (k === s.flueLast) k = (k + 1) % L.length; s.flueLast = k; return L[k]; }
const CACHE_SIGNS = [
  ['A lashing on one cache leg has gone slack and grey.', 'The cache leans a little more than it did.'],
  ['Fresh scratches on the cache post, just above where the pack hangs.', 'Tracks in the mud round the cache, going round twice.'],
  ['The lid sits a hand\'s width off true, and the knot is not the way you tied it.', 'A smear of grease on the corner post where something rubbed against it.']];
function cacheSign(s, force) { if (!(s.crafts.cache >= 2)) return null; const c = s.cacheCond ?? 0.8; const band = c < 0.3 ? 2 : c < 0.45 ? 1 : c < 0.62 ? 0 : -1; if (band < 0) return null; if (!force && !chance(s, 0.55)) return null; const L = CACHE_SIGNS[band]; return L[force ? s.day % L.length : Math.floor(rnd(s) * L.length)]; }
function nightAndBody(s, burn, done, lines) {
  const se = season(s); const T = temperature(s);
  // passive catches
  if (s.net && !s.net.torn) {
    if (chance(s, 0.45 * se.mult.fish * stockOf(s, 'lake') * (frozen(s) ? 0.6 : 1) * (windowOn(s, 'run') ? 1.6 : 1) * (s.net.poor ? 0.55 : 1))) { const n = 1 + Math.floor(rnd(s) * (frozen(s) ? 2 : windowOn(s, 'run') ? 4 : 3)); takeStock(s, 'lake', n); for (let k = 0; k < n; k++) s.net.catch.push(pickW(s, se.pools.fish)); }
    if (s.net.catch.length > 3) s.net.catch.splice(0, s.net.catch.length - 3);
    if (chance(s, 0.025 * (s.storm ? 4 : s.wind ? 2.5 : 1))) { s.net.torn = true; s.net.catch = []; lines.push([s.storm || s.wind ? 'The weather tore the net.' : 'Something tore the net.', 'bad']); }
  }
  if (s.trapsCatch.length) { const before = s.trapsCatch.length; s.trapsCatch = s.trapsCatch.filter(() => !chance(s, 0.15)); if (s.trapsCatch.length < before) lines.push([pick1(s, ['Something got to a snared animal before you did: tufts of fur, blood on the snow and a snapped wire.', 'Fresh fox tracks round the trapline in the morning. One of the snares is empty and pulled flat.']), 'muted']); }
  const trapP = 0.018 * se.mult.trap * s.skill.trap * (snowy(s) ? 1.25 : 1) * stockOf(s, 'trap'); const tc0 = s.trapsCatch.length;
  const good = Math.min(s.snares, (s.sys && s.sys.goodSnares) || 0); if (s.sys && s.sys.goodSnares) s.sys.goodSnares = good; // snares on a run the animals really use catch half again as often

const BADGES = [

  ['net', 'Netter', 'Caught fish in a net'], ['smoke', 'Smokehouse', 'Smoked meat or fish'], ['cabin', 'Cabin', 'Built a cabin'], ['big', 'Big game', 'Took down a deer, boar, moose or bigger'],
  ['bear', 'Stood your ground', 'Faced down a bear'], ['salvage', 'Beachcomber', 'Found three pieces of debris'], ['podium', 'Top three', 'Finished in the top three'], ['winner', 'Last one out', 'Won a season'],
  ['sweep', 'All seasons', 'Finished a run in every season'], ['daily', 'Daily challenge', 'Finished a daily challenge'],
  ['rock', 'Stone walls', 'Built the rock shelter'], ['burned', 'Burned out', 'Burned your own shelter down'], ['walker', 'Ten kilometres', 'Walked 10 km in one run'], ['ford', 'River crosser', 'Crossed the river twenty times'], ['trapline', 'Trapline', 'Ran a line of six or more sets'], ['tarpstorm', 'Under canvas', 'Rode out a storm in a tarp camp'],

function earnedBadges(s, place) {
  const b = new Set();
  if (s.firstFire) b.add('fire'); if (s.day >= 7) b.add('week'); if (s.day >= 30) b.add('month'); if (s.day >= 60) b.add('sixty');
  if (s.log.some(d => d.lines.some(l => /^Net:/.test(l[0])))) b.add('net'); if (s.stats.smoked) b.add('smoke');
  if (s.shelterType === 'cabin' || s.stats.cabin) b.add('cabin'); if (s.stats.bigGame.length) b.add('big'); if (s.stats.bear) b.add('bear'); if (s.found.length >= 3) b.add('salvage');
  if (s.shelterType === 'rock' || s.stats.rock) b.add('rock'); if (s.stats.lost.includes('shelter fire')) b.add('burned'); if (s.stats.walked >= 10000) b.add('walker'); if ((s.stats.ford || 0) >= 20) b.add('ford'); if ((s.stats.sets || 0) >= 6) b.add('trapline'); if (s.stats.tarpstorm) b.add('tarpstorm');

}
function recordRun(s, place) { // once per run; returns {newBest, newBadges}
  if (s.recorded) return { newBest: false, newBadges: [] };
  s.recorded = true;
  const r = records.seasons[s.seasonKey] || (records.seasons[s.seasonKey] = { runs: 0, bestDays: 0, bestPlace: 99, wins: 0 });
  r.runs++; const newBest = s.day > r.bestDays; r.bestDays = Math.max(r.bestDays, s.day); r.bestPlace = Math.min(r.bestPlace, place); if (s.status === 'won') r.wins++;
  if (s.daily) { records.daily = records.daily || {}; const d = records.daily[s.daily] || (records.daily[s.daily] = { days: 0, place: 99 }); d.days = Math.max(d.days, s.day); d.place = Math.min(d.place, place); d.season = s.seasonKey; }
  const got = earnedBadges(s, place); if (Object.keys(records.seasons).length >= D.seasons.length) got.add('sweep');
  const newBadges = []; for (const k of got) if (!records.badges[k]) { records.badges[k] = new Date().toISOString().slice(0, 10); newBadges.push(k); }
  saveRecords(); return { newBest, newBadges };
}
function dailyKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dailyPlan(key = dailyKey()) { let h = 2166136261; for (const ch of key) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return { key, seed: h, season: D.seasons[h % D.seasons.length] }; }
function startGame(seasonKey, gear, opts) { S = E.newGame(seasonKey, gear, opts); S.big = true; view = { kind: 'morning', title: 'Drop day', lines: S.log[0].lines, first: true }; save(); renderGame(); window.scrollTo(0, 0); }
function summaryText() {
  const se = E.season(S); const place = S.status === 'won' ? 1 : placeOf();

    { const cats = {}; for (const r of se.rivals) if (r.place !== 1 && r.cat) cats[r.cat] = (cats[r.cat] || 0) + 1; const list = Object.entries(cats).sort((a, b) => b[1] - a[1]); if (list.length) { sh.append($(`<div class="sect">How people leave here</div>`)); const r = $(`<div class="rows"></div>`); for (const [k, n] of list) { const who = se.rivals.filter(x => x.cat === k && x.place !== 1).sort((a, b) => a.days - b.days); r.append($(`<div class="row"><span>${esc(k)}</span><span>${n} · day${who.length > 1 ? 's' : ''} ${esc(who.map(x => x.days).join(', '))}</span></div>`)); } sh.append(r); sh.append($(`<div class="muted" style="font-size:12px">The same things take you out here: an axe slip, a hook in the hand, bad water, a smoky fire, a night that breaks you.</div>`)); } }
    if (S.windows && S.windows.length) { sh.append($(`<div class="sect">This season's calendar</div>`)); const cr = $(`<div class="rows"></div>`); for (const w of S.windows) { const on = S.day >= w.from && S.day <= w.to, past = S.day > w.to; cr.append($(`<div class="row"><span class="${on ? 'tone-big' : past ? 'tone-muted' : ''}">${esc(w.label)}</span><span>${on ? 'now, until day ' + w.to : past ? 'days ' + w.from + '–' + w.to : 'around day ' + (w.from + 1)}</span></div>`)); } sh.append(cr); }
    const c = se.climate;
    sh.append($(`<div class="row"><span>Weather</span><span>${c.snow ? 'snow from about day ' + c.snow : 'no lasting snow'}${c.freeze ? ', ice from about day ' + c.freeze : ''}</span></div>`));
    sh.append($(`<div class="muted" style="font-size:12px">Percentages are shares of this area's catch pool, not odds. Animal sizes and calories are approximate game values.</div>`));
  });
}
function openJournal() {
  sheet((sh) => {
    sh.append($(`<h2>Journal</h2>`));
    const days = S.log.slice().reverse();
    if (S.today && S.today.lines.length && S.phase >= 0) days.unshift({ day: S.day, lines: S.today.lines, today: true });
    for (const d of days) {
      sh.append($(`<div class="grp">${d.day === 0 ? 'Drop day' : 'Day ' + d.day}${d.today ? ' · so far' : ''}</div>`));
      const ul = $(`<ul class="log journal"></ul>`); for (const [t, c] of d.lines) ul.append($(`<li class="tone-${c}">${esc(t)}</li>`)); if (!d.lines.length) ul.append($(`<li class="tone-muted">A quiet day.</li>`)); sh.append(ul);
    }
  });
}
function openMenu() {
  sheet((sh, close) => {
    sh.append($(`<h2>Menu</h2>`));
    const camp = $(`<button class="act"><b>Camp and food</b><small>Fire, shelter, traps, food stores, rationing</small></button>`); camp.onclick = () => { close(); openCamp(); };
    const body = $(`<button class="act"><b>Body</b><small>Weight, nutrition, injuries</small></button>`); body.onclick = () => { close(); openBody(); };
    const notes = $(`<button class="act"><b>Field notes</b><small>What the land gives here</small></button>`); notes.onclick = () => { close(); openNotes(); };
    const jour = $(`<button class="act"><b>Journal</b><small>Every day so far</small></button>`); jour.onclick = () => { close(); openJournal(); };
    sh.append(camp, body, notes, jour, $(`<div class="grp">Game</div>`));
    const how = $(`<button class="act"><b>How to play</b><small>Rules, odds and what the numbers mean</small></button>`); how.onclick = () => { close(); openHow(); };
    const rec = $(`<button class="act"><b>Records and badges</b><small>Your best runs on every season</small></button>`); rec.onclick = () => { close(); openRecords(); };
    sh.append(how, rec, $(`<div class="grp">This run</div>`));
    const tap = $(`<button class="act danger"><b>Tap out</b><small>End this run now. You can't undo it.</small></button>`);
    let armed = false;
    tap.onclick = () => { if (!armed) { armed = true; tap.querySelector('b').textContent = 'Tap out: press again to confirm'; return; } if (mini) mini.cancel(); E.tapOut(S); view = null; save(); close(); if (W) W.over = true; renderEnd(); };
    const quit = $(`<button class="act"><b>Abandon and pick a new season</b><small>Deletes this run</small></button>`);
    let armed2 = false;
    quit.onclick = () => { if (!armed2) { armed2 = true; quit.querySelector('b').textContent = 'Delete this run: press again'; return; } store.del(SAVE); S = null; view = null; close(); renderSetup(); };
    sh.append(tap, quit, $(`<div class="grp">Settings</div>`), settingsBlock());
  });
}

function settingsBlock() {
  const b = $(`<div class="rows" style="margin-bottom:6px">
    <label class="row" style="cursor:pointer"><span>Sound</span><input type="checkbox" id="snd" ${settings.sound ? 'checked' : ''}></label>
    <input class="vol" id="vol" type="range" min="0" max="1" step="0.05" value="${settings.volume}" aria-label="Volume">
    <label class="row" style="cursor:pointer"><span>Vibration</span><input type="checkbox" id="hap" ${settings.haptics ? 'checked' : ''}></label>
  </div>`);
  b.querySelector('#snd').onchange = (e) => { settings.sound = e.target.checked; saveSettings(); sfx.unlock(); sfx.apply(); if (settings.sound) sfx.play('good'); updateAmbience(); };
  b.querySelector('#vol').oninput = (e) => { settings.volume = +e.target.value; saveSettings(); sfx.apply(); };
  b.querySelector('#vol').onchange = () => sfx.play('good');
  b.querySelector('#hap').onchange = (e) => { settings.haptics = e.target.checked; saveSettings(); buzz(30); };
  return b;
}
function openHow() {
  sheet((sh) => {
    sh.append($(`<h2>How to play</h2>`));
    sh.append($(`<div class="rows how" style="font-size:14px;gap:10px">
      <div class="sect">The goal</div>
      <div><b>Outlast the other survivors.</b> They leave on set days, whatever you do. You take one of their places.</div>
      <div><b>You go home by the rules of the challenge.</b> Drop below the medical BMI line (about a third of your weight if you start at 180 lb, more if you start heavy), let health reach zero, or let your will run out and tap out.</div>
      <div class="sect">Your day</div>
      <div><b>Walk.</b> Drag anywhere to walk, or tap where you want to go. Walk up to water, a tree, a bush, the game trail or your camp, and what you can do there appears at the bottom.</div>
      <div><b>Daylight is the budget.</b> Every button says what you get and how long it takes; the chip at the top counts the light left. Days shorten as the snow comes. Be back at camp by dusk. After dark you get a couple of hours by the fire to cook, clean, mend and craft. Sleep rough and you wake where you lay, cold, with the food back at camp.</div>
      <div><b>The ground is big, and it is yours.</b> About 290 m by 200 m, laid out fresh for every run: the shoreline, a river and its one ford, the game trail, a berry meadow, big timber, a bog and a rock face behind camp all land somewhere different, and what grows there is what grows at that site. Everything is drawn to scale, and the clock runs by it: a walk is 4 km an hour, about 15 minutes a kilometre. The map fills in as you explore; tap it to walk anywhere you have been, and mark the spots worth coming back to.</div>
      <div><b>No two days are alike.</b> Storms close the water and bed the game down, fog grounds the bow until it lifts, wind eats firewood and tears nets, heat drains your water. Fish bite at dawn and dusk; deer move at the edges of the day. Each season has its calendar of ripening berries, a fish run, the rut and freeze-up, and the orange chip under the day tells you what is on.</div>
      <div class="sect">Everything is gathered and carried</div>
      <div><b>Nothing comes from nowhere.</b> A lean-to is poles, boughs and cordage you cut yourself; a cabin needs logs and an axe or saw. A fire needs firewood, tinder and a ferro rod or a bow drill. Water is carried up from the shore before you can boil it. Paracord and rope count as cordage; anything else is twisted from bark or hide. Hooks snap, axes dull and arrows break.</div>
      <div><b>Read the tree.</b> A sapling gives poles and clean bark for cordage. A big spruce gives cabin logs and thick boughs; a big birch gives bark sheets you can fold into a bucket. A standing dead tree is the best firewood there is, with punk for tinder, and a fallen log hides grubs. Green wood from a live tree smokes and gives half the heat until it seasons.</div>
      <div><b>What you take stays taken.</b> Each tree gives its limbs, boughs and bark once a season, and what you fell stays felled. Birch bark is sheets or tinder, not both, and limbs cut for poles take their boughs with them. A picked bush stays picked, though greens and nettle tops come back in about ten days. Fish and game thin out where you work them hardest and come back slowly, so the good ground near camp runs out and you walk further.</div>
      <div><b>Everything heavy is carried.</b> Logs, poles, firewood, stones, clay, boughs and moss go on your back: about 28 kg when you are well, less when you are not, and you walk slower under it. What will not fit is stacked where you cut it. Walk into camp to unload, then go back for the rest. If camp ends up in the wrong place you can move it, every pile with it, trip by trip.</div>
      <div class="sect">Camp and food</div>
      <div><b>Pick a shelter and live with it.</b> A tarp camp, a lean-to, a debris hut, a stone wall under the rock, or a cabin. They sleep differently, wear differently, and only some have room to work inside. Go in when it rains to whittle, twist cordage and carve hooks. A fire inside without a chimney is how people burn their homes down. Shelters wear in bad weather and leak until you patch them.</div>
      <div><b>Every job is in your hands.</b> Cast, set the hook when the float dips, and keep the line in the tension band. Stalk with the wind in your face, draw, and release in the window; a poor shot leaves a blood trail to follow. Swing the axe on the beat, size the snare loop, read the mushroom before you pick it, gut the kill where it fell and carry it home in loads. The season's real odds sit underneath all of it.</div>
      <div><b>Food spoils.</b> Clean a catch at camp the day you get it, and smoke fish and meat to keep them. Hang the cache a walk from camp or every bear will know where it is; one built in a hurry, or left to weather, gets torn open. Raw hides go off in about a week unless dried in the smoke, mice chew cordage left lying, and a woodpile without a roof soaks through.</div>
      <div><b>Small things add up.</b> Spruce tea for scurvy, broth from cracked bones, meat dried on a rack or in the smoker until it snaps, tallow rendered from fat, and pemmican from the two that keeps for years, set lines that fish while you sleep, snowshoes once the snow is deep, mittens from hides. Lean meat with no fat leads to protein overload, so fat matters. Pick through the old camp for salvage, dig cattails at the beaver pond, climb to the berry slope.</div>
      <div class="sect">Keeping going</div>
      <div><b>Will is a skill.</b> Most runs here do not end in starvation; people go home. What carries the longest runs is routine: a varied day with something to show for it, a project on the go, a word to the camera, the letter once a week, a warm dry camp, a real meal, an hour by the fire with their hands busy. Each one takes some of the day's weight off your will; an idle, cold, hungry day takes all of it. The Body screen shows what held you up yesterday.</div>
      <div><b>The rare things can happen to you.</b> Anything rare in here can happen: the bear on the kill, the sea lion in the net, mice in the sleeping bag, a molar cracked on jerky, the axe the tide took, water rising into the shelter after a week of rain, fire creeping into the duff, baboons in camp, a sow with cubs in the berries, wolves circling at night.</div>
      <div class="sect">Controls</div>
      <div><span class="kbd">WASD</span> or arrows walk, <span class="kbd">Space</span> does the first thing on offer, <span class="kbd">1</span>–<span class="kbd">6</span> pick among them, <span class="kbd">Esc</span> closes a panel. <span class="kbd">J</span> journal, <span class="kbd">C</span> camp, <span class="kbd">B</span> body, <span class="kbd">P</span> pack, <span class="kbd">M</span> map.</div>
      <div class="muted" style="font-size:12.5px">Everything is stored on this device only: your save, records and settings. Nothing is sent anywhere.</div>
    </div>`));
  });
}
function openRecords() {
  sheet((sh) => {
    sh.append($(`<h2>Records</h2>`));
    const rows = $(`<div class="rows"></div>`); let any = false;
    for (const se of D.seasons) { const r = records.seasons[se.key]; if (!r) continue; any = true; rows.append($(`<div class="row"><span>${esc(se.name)} · ${esc(se.location)}</span><span><span class="num">${r.bestDays}</span> days · best place <span class="num">${r.bestPlace}</span>${r.wins ? ` · <span class="tone-big">won ${r.wins}x</span>` : ''} · ${r.runs} run${r.runs === 1 ? '' : 's'}</span></div>`)); }
    if (!any) rows.append($(`<div class="muted">No runs finished yet.</div>`));
    sh.append(rows);
    sh.append($(`<div class="sect">Badges <span class="num muted" style="font-family:var(--mono);font-size:13px">${Object.keys(records.badges).length}/${BADGES.length}</span></div>`));
    const g = $(`<div class="badges"></div>`);
    for (const [k, name, how] of BADGES) g.append($(`<div class="badge ${records.badges[k] ? '' : 'off'}"><b>${esc(name)}</b><small>${esc(records.badges[k] ? 'Earned ' + records.badges[k] : how)}</small></div>`));
    sh.append(g);
  });
}

// ------------------------------------------------------------ end screen
function renderEnd() {
  const se = E.season(S); app.className = 'wrap'; app.replaceChildren();
  const won = S.status === 'won';
  const cast = S.rivals.filter(r => r.days != null).map(r => ({ name: r.name, days: r.days, reason: r.reason, place: r.place }));
  cast.push({ name: 'You', days: S.day, reason: S.endReason, me: true });
  // ties go to you, except against the winner: going home on their last day is not a win
  cast.sort((a, b) => b.days - a.days || (a.me ? (b.place === 1 ? 1 : -1) : b.me ? (a.place === 1 ? -1 : 1) : 0));
  const place = won ? 1 : cast.findIndex(c => c.me) + 1;
  const rec = recordRun(S, place); save();
  if (!renderEnd.played) { renderEnd.played = S.seed; sfx.stopAll(); sfx.play(won ? 'win' : 'lose'); buzz(won ? [60, 40, 60, 40, 120] : 50); }
  const loss = Math.round((1 - S.weight / S.weight0) * 100);
  const caught = Object.entries(S.stats.caught).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k, n]) => `${n} ${E.low(D.foods[k].name)}`).join(', ');
  const end = $(`<section class="end" style="display:flex;flex-direction:column;gap:12px">
    <span class="label">${esc(se.name)} · ${esc(se.location)}</span>
    <h1 class="${won ? 'won' : 'lost'}">${won ? 'Last one out' : `Day ${S.day}`}</h1>
    <p style="margin:0">${esc(S.endReason)} ${won ? '' : `You finish in place <span class="num">${place}</span> of <span class="num">${cast.length}</span>.`}</p>
    <div class="stats"><div class="stat"><div class="label">Days</div><div class="v">${S.day}</div></div>
      <div class="stat"><div class="label">Weight lost</div><div class="v">${loss}%</div></div>
      <div class="stat"><div class="label">Kcal a day</div><div class="v">${fmt(S.stats.kcal / Math.max(1, S.day))}</div></div></div>
    <p class="muted" style="margin:0">${[E.shelterName(S) === 'No real shelter' ? 'No real shelter' : `Shelter: ${E.shelterName(S).toLowerCase()}`, S.stats.lost.includes('shelter fire') ? 'burned it down' : '', S.stats.walked ? `walked ${fmtDist(S.stats.walked)}` : '', caught ? `caught ${caught}` : ''].filter(Boolean).map(esc).join(' · ')}.</p>
    ${rec.newBest || rec.newBadges.length ? `<div class="alerts">${rec.newBest ? '<span class="alert tone-big">New personal best</span>' : ''}${rec.newBadges.map(k => `<span class="alert tone-big">Badge: ${esc(BADGES.find(b => b[0] === k)[1])}</span>`).join('')}</div>` : ''}
    ${S.daily ? `<p class="muted" style="margin:0">Daily challenge, ${esc(S.daily)}. Everyone who played today got the same site, the same ten items, and the same storms, cold snaps and visitors on the same days.</p>` : ''}
    <div class="sect">The other survivors${S.replaced ? `, with you in place of ${esc(S.replaced)}` : ''}</div>
    <table class="cast"><tbody></tbody></table>
  </section>`);
  const tb = end.querySelector('tbody');
  cast.forEach((c, i) => tb.append($(`<tr class="${c.me ? 'me' : ''}"><td>${i + 1}</td><td>${esc(c.name)}<div class="muted" style="font-size:12px">${esc(c.me ? '' : c.reason)}</div></td><td>${c.days}</td></tr>`)));
  app.append(end);
  const again = $(`<button class="big-btn">Same site, new run</button>`);
  again.onclick = () => { renderEnd.played = null; startGame(S.seasonKey, S.gear, { weight: S.weight0, showRemaining: S.opts.showRemaining }); };
  const share = $(`<button class="act" style="text-align:center"><b>Share this run</b><small>Copies a short summary</small></button>`);
  share.onclick = async () => { const t = summaryText(); try { if (navigator.share) await navigator.share({ text: t }); else { await navigator.clipboard.writeText(t); share.querySelector('small').textContent = 'Copied.'; } } catch (e) { share.querySelector('small').textContent = t; } };
  const other = $(`<button class="linkbtn" style="align-self:center">Pick another season</button>`);
  other.onclick = () => { renderEnd.played = null; setup.season = S.seasonKey; setup.gear = S.gear.slice(); store.del(SAVE); S = null; renderSetup(); window.scrollTo(0, 0); };
  app.append(again, share, other);
}

// ------------------------------------------------------------ keys
document.addEventListener('keydown', (e) => {
  if (['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) { input.keys[e.key] = true; if (app.className === 'play') e.preventDefault(); return; }
  if (app.className !== 'play' || document.querySelector('.scrim') || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea') return;
  if (e.key === ' ' || e.key === 'Enter') { const t = actsEl && actsEl.querySelector('.actbtn'); if (t) { e.preventDefault(); const a = interactions()[0]; if (a) a.fn(); } return; }
  if (/^[1-6]$/.test(e.key)) { const a = interactions()[+e.key - 1]; if (a) a.fn(); return; }
  if (e.key === 'j' || e.key === 'J') openJournal(); if (e.key === 'c' || e.key === 'C') openCamp(); if (e.key === 'b' || e.key === 'B') openBody(); if (e.key === 'p' || e.key === 'P') openPack(); if (e.key === 'm' || e.key === 'M') openMap();
});
document.addEventListener('keyup', (e) => { input.keys[e.key] = false; });

// ------------------------------------------------------------ boot
function scrubRivals(g) { // old saves carry the earlier roster's names: map by finishing place, keep days / out / everything else
  const se = D.seasons.find(x => x.key === g.seasonKey); if (!se || !se.rivals.length) return;
  const hash = (str) => { let x = 2166136261; for (const ch of String(str)) { x ^= ch.charCodeAt(0); x = Math.imul(x, 16777619) >>> 0; } return x >>> 0; };
  const byPlace = {}; for (const b of se.rivals) byPlace[b.place] = b;
  const have = new Set();
  for (const r of (g.rivals || [])) { const b = byPlace[r.place] || se.rivals[hash(r.name) % se.rivals.length]; r.name = b.name; r.reason = b.reason; have.add(r.place); }
  if (g.replaced) { const gap = se.rivals.find(b => b.place !== 1 && !have.has(b.place)); g.replaced = (gap || se.rivals[hash(g.replaced) % se.rivals.length]).name; }
}
function migrate(g) { // fill anything a newer build added, so a save survives updates
  const needRivals = g.rivalsV !== 1;
  if (g.sys !== undefined && (!g.sys || typeof g.sys !== 'object' || Array.isArray(g.sys) || g.sys.schema !== 1)) { console.warn('Save had an unreadable sys block; reset it.'); g.sys = undefined; }
  if (g.mapV === undefined) g.mapV = 1; // saves from before drop sites varied keep the map they started on
  const fresh = E.newGame(g.seasonKey, g.gear || [], { weight: g.weight0, seed: g.seed });
  const fill = (dst, src) => { for (const k in src) { if (dst[k] === undefined) dst[k] = src[k]; else if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && dst[k] && typeof dst[k] === 'object' && !Array.isArray(dst[k])) fill(dst[k], src[k]); } };
  fill(g, fresh); if (!g.stats.walked) g.stats.walked = 0; if (g.shelterLvl && !g.shelterType) g.shelterType = ['', 'leanto', 'hut', 'cabin'][g.shelterLvl]; for (const x of (g.stores || []).concat(g.raw || [])) if (x.left == null || x.left > 1e8) x.left = Infinity; if (needRivals) scrubRivals(g); g.rivalsV = 1; g._at = null; g.v = 2; return g;
}
function start(hot) {
  const raw = (hot && hot.game) || store.get(SAVE);
  if (raw) { try { const g = typeof raw === 'string' ? JSON.parse(raw) : raw; if (g && g.v >= 2 && D.seasons.some(x => x.key === g.seasonKey)) S = migrate(g); } catch (e) { S = null; } }
  if (!S) { setup.gear = POPULAR.slice(); renderSetup(); }
  else renderGame();
}
window.claude?.hot?.snapshot?.(() => ({ game: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
